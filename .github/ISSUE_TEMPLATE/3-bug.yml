name: Bug
description: The site does not behave as it should.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: constate
    attributes:
      label: What happens
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: How to reproduce it
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: contexte
    attributes:
      label: Browser and device
      placeholder: Firefox 142 on Android
