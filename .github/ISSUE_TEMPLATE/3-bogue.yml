name: Bogue
description: Le site ne se comporte pas comme il devrait.
title: "[bogue] "
labels: ["bogue"]
body:
  - type: textarea
    id: constate
    attributes:
      label: Ce qui se passe
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true
  - type: input
    id: contexte
    attributes:
      label: Navigateur et appareil
      placeholder: Firefox 142 sur Android
