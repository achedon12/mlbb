name: Donnee incorrecte
description: Une statistique, un role, un prix ou un skin qui ne correspond pas au jeu.
title: "[donnee] "
labels: ["donnees"]
body:
  - type: markdown
    attributes:
      value: |
        Les donnees du site sont extraites automatiquement du wiki communautaire.
        Si l'erreur vient de la source, le mieux est souvent de la corriger
        directement sur le wiki : la prochaine synchronisation la reprendra.
        Ouvrez quand meme une issue, on verifiera d'ou vient le probleme.
  - type: input
    id: page
    attributes:
      label: Page concernee
      placeholder: https://mlbb.leoderoin.fr/heros/khufra
    validations:
      required: true
  - type: textarea
    id: constate
    attributes:
      label: Ce que le site affiche
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: Ce que le jeu affiche
      description: Une capture d'ecran du jeu est le meilleur argument.
    validations:
      required: true
