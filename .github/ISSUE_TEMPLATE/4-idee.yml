name: Idee
description: Proposer une fonctionnalite ou une amelioration.
title: "[idee] "
labels: ["idee"]
body:
  - type: textarea
    id: besoin
    attributes:
      label: Le besoin
      description: Quel probleme cela resout-il, pour qui ? Decrivez le besoin avant la solution.
    validations:
      required: true
  - type: textarea
    id: proposition
    attributes:
      label: Ce que vous proposez
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Ce que vous avez envisage d'autre
