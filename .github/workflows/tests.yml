name: Tests

# Automated tests: business logic on one side, browser journeys on the other.
# Two separate jobs so that one does not hide the other.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# On a pull request, a new push cancels the tests of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit and functional tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Vitest
        run: npm test

  browser:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        id: build
        run: npm run build

      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"

      # Content checks on the same build: titles, placeholders, empty pages,
      # translations and the JSON the client reads (see scripts/smoke-check.mjs).
      # Runs even when Playwright failed, so that one does not hide the other.
      - name: Content smoke check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PORT: "3100"
        run: |
          node scripts/start.mjs > smoke-server.log 2>&1 &
          server=$!
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$PORT/api/health" > /dev/null 2>&1; then break; fi
            sleep 2
          done
          status=0
          node scripts/smoke-check.mjs "http://127.0.0.1:$PORT" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::group::Server log"
            cat smoke-server.log
            echo "::endgroup::"
          fi
          # start.mjs runs the standalone server as a child: stop both.
          pkill -P "$server" 2> /dev/null || true
          kill "$server" 2> /dev/null || true
          exit "$status"

      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
