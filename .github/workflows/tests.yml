name: Tests

# Les tests automatises : logique metier d'un cote, parcours de navigateur de
# l'autre. Deux jobs distincts pour que l'un ne masque pas l'autre.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  unitaires:
    name: Unitaires et fonctionnels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Vitest
        run: npm test

  navigateur:
    name: Navigateur (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Build de production
        run: npm run build

      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Rapport en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
