name: Tests

# Les tests automatises : logique metier d'un cote, parcours de navigateur de
# l'autre. Deux jobs distincts pour que l'un ne masque pas l'autre.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Sur une pull request, un nouveau push annule les tests du precedent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unitaires:
    name: Unitaires et fonctionnels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Vitest
        run: npm test

  navigateur:
    name: Navigateur (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Build de production
        run: npm run build

      - name: Playwright
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Rapport en cas d'echec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
