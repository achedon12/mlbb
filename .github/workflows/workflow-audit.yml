name: Workflows

# Relit les workflows eux-memes : actionlint pour la syntaxe, les expressions et
# les scripts shell ; zizmor pour la securite (droits trop larges, declencheurs
# dangereux, injections, actions non epinglees, identifiants conserves).
on:
  push:
    branches: [main, develop]
    paths: [".github/**"]
  pull_request:
    paths: [".github/**"]

permissions: {}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/depot" -w /depot rhysd/actionlint:1.7.12 -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true
