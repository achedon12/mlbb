name: Synchronisation des donnees

# Deux rythmes. Chaque jour, les mesures qui bougent vite — tendances,
# coequipiers, taux par duree de partie — alimentent l'historique long : l'API
# ne remonte que trente jours, et seul un passage regulier les conserve au-dela.
# Chaque lundi, la synchronisation complete relit en plus le catalogue du wiki
# (heros, skins, objets, patchs, combos), traduit, et verifie que le site
# compile.
#
# Les donnees sont committees directement sur main, la production, sans
# intervention : une pull request par jour ne serait jamais relue, et deux
# branches de donnees entreraient en conflit sur les memes fichiers.
#
# Le push se fait avec la cle de deploiement SYNC_DEPLOY_KEY, seule autorisee a
# contourner la protection de main. Un push fait avec une cle declenche les
# workflows : Image Docker deploie le site, Aligner develop reporte les donnees
# sur develop. Sans cle (main non protegee), le push passe par GITHUB_TOKEN, qui
# ne declenche rien : les deux workflows sont alors appeles explicitement.
on:
  schedule:
    # Tous les jours sauf le lundi, 3 h 30 UTC : mesures seules.
    - cron: "30 3 * * 0,2-6"
    # Le lundi, meme heure : synchronisation complete.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      complete:
        description: Synchronisation complete (catalogue du wiki compris)
        type: boolean
        default: false

permissions: {}

# Une synchronisation a la fois : deux executions pousseraient les memes fichiers.
concurrency:
  group: synchronisation
  cancel-in-progress: false

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      par-cle: ${{ steps.cle.outputs.presente }}
    env:
      COMPLETE: ${{ github.event.schedule == '30 3 * * 1' || inputs.complete == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Identifiants conserves : l'etape de commit pousse sur main.
        with: # zizmor: ignore[artipacked]
          ref: main
          # Vide, checkout se rabat sur GITHUB_TOKEN.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Pousser avec la cle de deploiement ?
        id: cle
        run: echo "presente=${{ secrets.SYNC_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Relire les sources et telecharger les visuels
        id: complete
        if: env.COMPLETE == 'true'
        # Wiki ou API en panne : on se rabat sur les seules mesures, plus bas.
        continue-on-error: true
        run: npm run sync -- --images

      - name: Traduire les contenus repris en anglais
        if: steps.complete.outcome == 'success'
        run: npm run traduire

      - name: Prendre l'instantane de la veille
        if: steps.complete.outcome == 'success'
        run: npm run veille

      - name: Verifier que le site compile avec les nouvelles donnees
        if: steps.complete.outcome == 'success'
        run: npm run build

      - name: Mesures du jour (tendances, coequipiers, durees de partie)
        if: env.COMPLETE != 'true' || steps.complete.outcome == 'failure'
        run: |
          # L'API communautaire flanche parfois. Le script garde alors les
          # mesures precedentes et l'historique deja cumule ; on retente une
          # fois un quart d'heure plus tard. Une panne persistante ne laisse
          # qu'un avertissement : les trente jours de l'API seront repris au
          # passage suivant.
          for essai in 1 2; do
            if npm run sync:evolution; then exit 0; fi
            if [ "$essai" = 1 ]; then sleep 900; fi
          done
          echo "::warning::API des mesures indisponible : historique inchange aujourd'hui."

      - name: Ecarter un fichier de donnees illisible
        run: |
          # Une execution interrompue en pleine ecriture ne doit rien casser sur main.
          for f in $(git ls-files -m -o --exclude-standard -- src/data | grep '\.json$'); do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; then
              echo "::warning::$f illisible, version precedente conservee"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done

      - name: Committer les donnees sur main
        id: commit
        run: |
          # Donnees, visuels, traductions et leurs caches : rien d'autre (le build
          # ne doit rien glisser dans le commit).
          git add -A -- src/data public/visuels content src/i18n/messages 'scripts/traductions*.json'
          # synchro.json porte l'horodatage de l'execution : seul, il ne merite
          # pas de commit.
          if git diff --cached --quiet -- . ':(exclude)src/data/jeu/synchro.json'; then
            echo "Aucune donnee nouvelle."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.complete.outcome }}" = success ]; then
            git commit -q -m "Sync game data from the wiki and the stats API ($(date -u +%F))"
          else
            git commit -q -m "Record hero rate history for $(date -u +%F)"
          fi
          # main a pu avancer pendant la synchronisation : on rejoue par-dessus.
          for _ in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              git log -1 --stat --format='%h %s' | tail -3
              exit 0
            fi
            sleep 15
          done
          echo "::error::Push sur main refuse : main est protegee et SYNC_DEPLOY_KEY manque, ou n'a pas le droit de contourner la protection."
          exit 1

  # Sans cle, le push n'a declenche aucun workflow : on deploie et on aligne
  # develop ici. Avec la cle, le push s'en est charge.
  deployer:
    needs: synchroniser
    if: needs.synchroniser.outputs.commit != '' && needs.synchroniser.outputs.par-cle != 'true'
    # Chemin local : le workflow du commit en cours, comme voulu.
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.synchroniser.outputs.commit }}
      deployer: true
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read

  aligner:
    needs: synchroniser
    if: needs.synchroniser.outputs.commit != '' && needs.synchroniser.outputs.par-cle != 'true'
    # Chemin local : le workflow du commit en cours, comme voulu.
    uses: ./.github/workflows/align-develop.yml # zizmor: ignore[self-repository]
    secrets:
      SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
    permissions:
      contents: write
