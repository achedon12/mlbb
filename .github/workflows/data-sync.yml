name: Data sync

# Two rhythms. Every day, everything measured in ranked games is refreshed:
# the ranking (win, ban and pick rates, which the tier list is computed from),
# counters, played builds, and the fast-moving measures (trends, teammates,
# rates by game duration) that feed the long history: the API only goes back
# thirty days, and only a regular run keeps them beyond that. Every Monday, the full sync also
# rereads the wiki catalogue (heroes, skins, items, patches, combos), translates
# it, and checks that the site builds. The patch list (Liquipedia, with the
# Fandom wiki's notes) is also refreshed every day, translated and
# build-checked only when it changed.
#
# The data is committed straight to main, production, with no human step: a
# daily pull request would never be reviewed, and two data branches would
# conflict on the same files.
#
# The push uses the SYNC_DEPLOY_KEY deploy key, the only one allowed to bypass
# main's protection. A push made with a key triggers workflows: Docker image
# deploys the site, Align develop carries the data over to develop. Without a
# key (unprotected main), the push goes through GITHUB_TOKEN, which triggers
# nothing: both workflows are then called explicitly.
on:
  schedule:
    # Every day except Monday, 3:30 UTC: measures only.
    - cron: "30 3 * * 0,2-6"
    # Monday, same time: full sync.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      complete:
        description: Full sync (wiki catalogue included)
        type: boolean
        default: false

permissions: {}

# One sync at a time: two runs would push the same files.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      with-key: ${{ steps.key.outputs.present }}
    env:
      COMPLETE: ${{ github.event.schedule == '30 3 * * 1' || inputs.complete == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials kept: the commit step pushes to main.
        with: # zizmor: ignore[artipacked]
          ref: main
          # When empty, checkout falls back to GITHUB_TOKEN.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Push with the deploy key?
        id: key
        run: echo "present=${{ secrets.SYNC_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The community API refuses its ranking endpoint (HTTP 403) to cloud
      # runners and answers the production server: fetch the six ranks through
      # it (six small requests). Without the deploy secrets, or if the server
      # does not answer, the sync asks the API directly, as before.
      - name: Ranking through the production server
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ vars.DEPLOY_HOST }}
          SSH_USER: ${{ vars.DEPLOY_USER }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ] || [ -z "$SSH_HOST" ]; then
            echo "No deploy secrets: the ranking is asked to the API directly."
            exit 0
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          dir="$RUNNER_TEMP/ranking"
          mkdir -p "$dir"
          ua=$(node -e "const s=require('fs').readFileSync('scripts/sync.mjs','utf8');console.log(s.match(/const UA = \"([^\"]+)\"/)[1])")
          for rank in all epic legend mythic honor glory; do
            if ssh -i ~/.ssh/relay_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
              "curl -sf --max-time 30 -A '$ua' 'https://arena.rone.dev/api/heroes/rank?size=200&rank=$rank'" > "$dir/$rank.json"; then
              echo "$rank: $(wc -c < "$dir/$rank.json") bytes"
            else
              rm -f "$dir/$rank.json"
              echo "::warning::Ranking $rank not relayed by the server"
            fi
          done
          echo "RANKING_RELAY_DIR=$dir" >> "$GITHUB_ENV"
          rm -f ~/.ssh/relay_key

      - name: Reread the sources and download the images
        id: complete
        if: env.COMPLETE == 'true'
        # Wiki or API down: fall back to the measures alone, below.
        continue-on-error: true
        run: npm run sync -- --images

      # Monthly lists and test-server notes: a failure keeps the previous data.
      - name: Events calendar (StarLight, Collector)
        if: steps.complete.outcome == 'success'
        continue-on-error: true
        run: node scripts/events.mjs

      - name: Advance Server patch notes
        if: steps.complete.outcome == 'success'
        continue-on-error: true
        run: node scripts/advance-server.mjs

      # Liquipedia, under its rate limits: about 20 s when nothing changed.
      - name: Esports tournaments and pro statistics
        if: steps.complete.outcome == 'success'
        continue-on-error: true
        run: node scripts/esports.mjs

      # This file comes from develop but runs main's code: until main has the
      # English script names, fall back to the French ones it still uses.
      - name: Translate the imported content
        if: steps.complete.outcome == 'success'
        run: |
          npm run "$(node -p "require('./package.json').scripts.translate ? 'translate' : 'traduire'")"

      - name: Take the watch snapshot
        if: steps.complete.outcome == 'success'
        run: |
          npm run "$(node -p "require('./package.json').scripts.watch ? 'watch' : 'veille'")"

      - name: Check that the site builds with the new data
        if: steps.complete.outcome == 'success'
        run: npm run build

      - name: Daily measures (ranking, counters, builds, trends, teammates)
        if: env.COMPLETE != 'true' || steps.complete.outcome == 'failure'
        run: |
          # The community API sometimes fails. The script then keeps the
          # previous measures and the history gathered so far; retry once a
          # quarter of an hour later. A lasting outage only leaves a warning:
          # the API's thirty days are picked up again at the next run.
          for attempt in 1 2; do
            if npm run sync:measures; then exit 0; fi
            if [ "$attempt" = 1 ]; then sleep 900; fi
          done
          echo "::warning::Measures API unavailable: history unchanged today."

      # The patch list follows Liquipedia every day: a patch shows as live
      # from its release day, not from the next Monday. A few requests when
      # nothing changed (one list, the recent pages); a failure keeps the
      # previous notes.
      - name: Patch list and notes (Liquipedia and the wiki)
        id: patches
        if: env.COMPLETE != 'true' || steps.complete.outcome == 'failure'
        continue-on-error: true
        run: |
          # main's code may predate the patches-only mode: without it, the
          # flag would start a full sync.
          if ! grep -q -- '"--patches"' scripts/sync.mjs; then
            echo "No patches-only sync on main yet: patches wait for the Monday run."
            exit 0
          fi
          npm run sync -- --patches

      - name: Translate and check the new patch notes
        if: steps.patches.outcome == 'success'
        run: |
          if git diff --quiet -- src/data/game/patches.json; then
            echo "No patch change."
            exit 0
          fi
          node scripts/translate-data.mjs patches || echo "::warning::Patch translation failed: new notes stay in English for now."
          # Daily runs skip the build: check it here, since the notes changed,
          # and drop the new patch data rather than push a site that does not build.
          if ! npm run build; then
            echo "::warning::The site does not build with the new patch notes: previous patch data kept."
            git checkout -- src/data/game/patches.json src/data/game/patches scripts/patches-cache.json
          fi

      - name: Discard an unreadable data file
        run: |
          # A run interrupted in the middle of a write must not break anything on main.
          for f in $(git ls-files -m -o --exclude-standard -- src/data | grep '\.json$'); do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; then
              echo "::warning::$f unreadable, previous version kept"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done

      - name: Commit the data to main
        id: commit
        run: |
          # Data, images, translations and their caches: nothing else (the build
          # must not slip anything into the commit).
          git add -A -- src/data public/visuels content src/i18n/messages 'scripts/*.json'
          # sync.json holds the run timestamp: on its own, it is not worth a
          # commit. Both paths: main still has the French one, and an exclude
          # that matches nothing silently excludes nothing.
          if git diff --cached --quiet -- . ':(exclude)src/data/game/sync.json' ':(exclude)src/data/jeu/synchro.json'; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.complete.outcome }}" = success ]; then
            git commit -q -m "Sync game data from the wiki and the stats API ($(date -u +%F))"
          else
            git commit -q -m "Record hero rate history for $(date -u +%F)"
          fi
          # main may have moved during the sync: replay on top of it. A conflict
          # means a release changed the synced files meanwhile (renamed or
          # reshaped data): this run's data was produced for the old main, so it
          # is dropped rather than forced in; running the sync again regenerates
          # it with the new code.
          for _ in 1 2 3; do
            if ! git pull -q --rebase origin main; then
              git rebase --abort 2> /dev/null || true
              echo "::error::main changed the synced files during this run (a release?): this run's data is discarded. Run the sync again."
              exit 1
            fi
            if git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              git log -1 --stat --format='%h %s' | tail -3
              exit 0
            fi
            sleep 15
          done
          echo "::error::Push to main refused: main is protected and SYNC_DEPLOY_KEY is missing, or is not allowed to bypass the protection."
          exit 1

  # Without a key, the push triggered no workflow: deploy and align develop
  # from here. With the key, the push took care of it.
  deploy:
    needs: sync
    if: needs.sync.outputs.commit != '' && needs.sync.outputs.with-key != 'true'
    # Local path: the workflow of the current commit, as intended.
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.sync.outputs.commit }}
      deploy: true
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read

  align:
    needs: sync
    if: needs.sync.outputs.commit != '' && needs.sync.outputs.with-key != 'true'
    # Local path: the workflow of the current commit, as intended.
    uses: ./.github/workflows/align-develop.yml # zizmor: ignore[self-repository]
    secrets:
      SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
    permissions:
      contents: write

  # Moonton ships a patch every three to six weeks. A live patch older than
  # six weeks means the patch sources stopped following: the job fails, and
  # GitHub emails the failure, instead of a moderator noticing it first.
  patch-freshness:
    needs: sync
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Live patch not older than six weeks
        env:
          REPO: ${{ github.repository }}
        run: |
          json=$(curl -fsSL "https://raw.githubusercontent.com/$REPO/main/src/data/game/patches.json")
          read -r version date < <(echo "$json" | jq -r '[.list[] | select(.date != null)][0] | "\(.version) \(.date)"')
          age=$(( ( $(date -u +%s) - $(date -u -d "$date" +%s) ) / 86400 ))
          echo "Live patch $version, released $date ($age days ago)"
          if [ "$age" -gt 42 ]; then
            echo "::error::Live patch $version is $age days old: check Liquipedia (Portal:Patches) and the Fandom wiki, a newer patch may be missing."
            exit 1
          fi
