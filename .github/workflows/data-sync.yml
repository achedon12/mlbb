name: Data sync

# Two rhythms. Every day, the fast-moving measures (trends, teammates, rates by
# game duration) feed the long history: the API only goes back thirty days, and
# only a regular run keeps them beyond that. Every Monday, the full sync also
# rereads the wiki catalogue (heroes, skins, items, patches, combos), translates
# it, and checks that the site builds.
#
# The data is committed straight to main, production, with no human step: a
# daily pull request would never be reviewed, and two data branches would
# conflict on the same files.
#
# The push uses the SYNC_DEPLOY_KEY deploy key, the only one allowed to bypass
# main's protection. A push made with a key triggers workflows: Docker image
# deploys the site, Align develop carries the data over to develop. Without a
# key (unprotected main), the push goes through GITHUB_TOKEN, which triggers
# nothing: both workflows are then called explicitly.
on:
  schedule:
    # Every day except Monday, 3:30 UTC: measures only.
    - cron: "30 3 * * 0,2-6"
    # Monday, same time: full sync.
    - cron: "30 3 * * 1"
  workflow_dispatch:
    inputs:
      complete:
        description: Full sync (wiki catalogue included)
        type: boolean
        default: false

permissions: {}

# One sync at a time: two runs would push the same files.
concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      with-key: ${{ steps.key.outputs.present }}
    env:
      COMPLETE: ${{ github.event.schedule == '30 3 * * 1' || inputs.complete == true }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Credentials kept: the commit step pushes to main.
        with: # zizmor: ignore[artipacked]
          ref: main
          # When empty, checkout falls back to GITHUB_TOKEN.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Push with the deploy key?
        id: key
        run: echo "present=${{ secrets.SYNC_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Reread the sources and download the images
        id: complete
        if: env.COMPLETE == 'true'
        # Wiki or API down: fall back to the measures alone, below.
        continue-on-error: true
        run: npm run sync -- --images

      # Monthly lists and test-server notes: a failure keeps the previous data.
      - name: Events calendar (StarLight, Collector)
        if: steps.complete.outcome == 'success'
        continue-on-error: true
        run: node scripts/events.mjs

      - name: Advance Server patch notes
        if: steps.complete.outcome == 'success'
        continue-on-error: true
        run: node scripts/advance-server.mjs

      # Liquipedia, under its rate limits: about 20 s when nothing changed.
      - name: Esports tournaments and pro statistics
        if: steps.complete.outcome == 'success'
        continue-on-error: true
        run: node scripts/esports.mjs

      # This file comes from develop but runs main's code: until main has the
      # English script names, fall back to the French ones it still uses.
      - name: Translate the imported content
        if: steps.complete.outcome == 'success'
        run: |
          npm run "$(node -p "require('./package.json').scripts.translate ? 'translate' : 'traduire'")"

      - name: Take the watch snapshot
        if: steps.complete.outcome == 'success'
        run: |
          npm run "$(node -p "require('./package.json').scripts.watch ? 'watch' : 'veille'")"

      - name: Check that the site builds with the new data
        if: steps.complete.outcome == 'success'
        run: npm run build

      - name: Daily measures (trends, teammates, game durations)
        if: env.COMPLETE != 'true' || steps.complete.outcome == 'failure'
        run: |
          # The community API sometimes fails. The script then keeps the
          # previous measures and the history gathered so far; retry once a
          # quarter of an hour later. A lasting outage only leaves a warning:
          # the API's thirty days are picked up again at the next run.
          for attempt in 1 2; do
            if npm run sync:evolution; then exit 0; fi
            if [ "$attempt" = 1 ]; then sleep 900; fi
          done
          echo "::warning::Measures API unavailable: history unchanged today."

      - name: Discard an unreadable data file
        run: |
          # A run interrupted in the middle of a write must not break anything on main.
          for f in $(git ls-files -m -o --exclude-standard -- src/data | grep '\.json$'); do
            if ! node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$f"; then
              echo "::warning::$f unreadable, previous version kept"
              git checkout -- "$f" 2>/dev/null || rm -f "$f"
            fi
          done

      - name: Commit the data to main
        id: commit
        run: |
          # Data, images, translations and their caches: nothing else (the build
          # must not slip anything into the commit).
          git add -A -- src/data public/visuels content src/i18n/messages 'scripts/*.json'
          # sync.json holds the run timestamp: on its own, it is not worth a
          # commit. Both paths: main still has the French one, and an exclude
          # that matches nothing silently excludes nothing.
          if git diff --cached --quiet -- . ':(exclude)src/data/game/sync.json' ':(exclude)src/data/jeu/synchro.json'; then
            echo "No new data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.complete.outcome }}" = success ]; then
            git commit -q -m "Sync game data from the wiki and the stats API ($(date -u +%F))"
          else
            git commit -q -m "Record hero rate history for $(date -u +%F)"
          fi
          # main may have moved during the sync: replay on top of it.
          for _ in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              git log -1 --stat --format='%h %s' | tail -3
              exit 0
            fi
            sleep 15
          done
          echo "::error::Push to main refused: main is protected and SYNC_DEPLOY_KEY is missing, or is not allowed to bypass the protection."
          exit 1

  # Without a key, the push triggered no workflow: deploy and align develop
  # from here. With the key, the push took care of it.
  deploy:
    needs: sync
    if: needs.sync.outputs.commit != '' && needs.sync.outputs.with-key != 'true'
    # Local path: the workflow of the current commit, as intended.
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.sync.outputs.commit }}
      deploy: true
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    permissions:
      contents: read

  align:
    needs: sync
    if: needs.sync.outputs.commit != '' && needs.sync.outputs.with-key != 'true'
    # Local path: the workflow of the current commit, as intended.
    uses: ./.github/workflows/align-develop.yml # zizmor: ignore[self-repository]
    secrets:
      SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
    permissions:
      contents: write
