name: Quality

# On every proposed change: check that the project builds before reviewing the
# substance.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# On a pull request, a new push cancels the check of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check that the generated data is in the repository
        run: |
          if [ ! -s src/data/game/heroes.json ]; then
            echo "src/data/game/heroes.json is missing or empty."
            echo "Run: npm run sync -- --images"
            exit 1
          fi
