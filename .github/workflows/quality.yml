name: Qualite

# Sur chaque proposition de modification : on verifie que le projet compile
# avant de relire le fond.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# Sur une pull request, un nouveau push annule la verification du precedent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verifier que les donnees generees sont a jour dans le depot
        run: |
          if [ ! -s src/data/jeu/heros.json ]; then
            echo "src/data/jeu/heros.json est absent ou vide."
            echo "Lancer : npm run sync -- --images"
            exit 1
          fi
