name: Synchronisation des donnees

# Le jeu evolue a chaque patch. Chaque semaine, on relit les deux sources — le
# wiki communautaire pour le catalogue (heros, skins, objets, patchs) et l'API
# communautaire pour les mesures (taux de victoire, classement, contres) — et
# on ouvre une pull request quand quelque chose a change.
#
# Une pull request plutot qu'un commit direct : un nouveau heros, un
# rechiffrage de la tier list ou un changement massif merite d'etre regarde
# avant d'atterrir en production.
on:
  schedule:
    # Tous les lundis a 4 h UTC, apres les mises a jour de fin de semaine.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchroniser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Relire les sources et telecharger les visuels
        run: npm run sync -- --images

      - name: Verifier que le site compile avec les nouvelles donnees
        run: npm run build

      - name: Resumer les changements
        id: resume
        run: |
          # `synchro.json` porte l'horodatage de l'execution : il change a
          # chaque fois, meme quand le wiki n'a pas bouge. On l'exclut de la
          # detection, sinon une pull request vide serait ouverte chaque
          # semaine.
          if git diff --quiet -- . ':(exclude)src/data/genere/synchro.json'; then
            echo "change=non" >> "$GITHUB_OUTPUT"
            echo "Le wiki n'a pas bouge."
            git checkout -- src/data/genere/synchro.json
          else
            echo "change=oui" >> "$GITHUB_OUTPUT"
            {
              echo "resume<<FIN"
              node -e "
                const s = require('./src/data/genere/synchro.json');
                console.log(\`- \${s.heros} heros, \${s.skins} skins, \${s.objets} objets\`);
                console.log(\`- \${s.patchs} patchs\`);
                if (s.classement) console.log(\`- \${s.classement} heros classes (taux du jeu)\`);
                if (s.contres) console.log(\`- \${s.contres} heros avec contres chiffres\`);
              "
              echo "FIN"
            } >> "$GITHUB_OUTPUT"
            git diff --stat | tail -1
          fi

      - name: Ouvrir la pull request
        if: steps.resume.outputs.change == 'oui'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: synchronisation/wiki
          # La branche est reutilisee d'une semaine sur l'autre : une seule
          # pull request de synchronisation ouverte a la fois.
          commit-message: "synchronise les donnees du jeu"
          author: achedon12 <82544800+achedon12@users.noreply.github.com>
          committer: achedon12 <82544800+achedon12@users.noreply.github.com>
          title: "Synchronisation des donnees du jeu"
          labels: donnees
          body: |
            Relecture automatique du wiki (catalogue) et de l'API communautaire
            (taux de victoire, classement, contres).

            ${{ steps.resume.outputs.resume }}

            Le site compile avec ces donnees. A verifier avant de fusionner :
            les nouveaux heros apparaissent dans le catalogue, la tier list
            reflete les taux du patch, et aucun visuel ne manque.
