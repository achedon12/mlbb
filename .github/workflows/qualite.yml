name: Qualite

# Sur chaque proposition de modification : on verifie que le projet compile
# avant de relire le fond.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verifier que les donnees generees sont a jour dans le depot
        run: |
          if [ ! -s src/data/jeu/heros.json ]; then
            echo "src/data/jeu/heros.json est absent ou vide."
            echo "Lancer : npm run sync -- --images"
            exit 1
          fi
