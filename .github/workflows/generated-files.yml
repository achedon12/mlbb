name: Generated files

# src/data/game/ and public/visuels/ are regenerated by the sync: a manual edit
# would be overwritten the next night. A pull request touching them fails here;
# the fix belongs in the scripts, or on the source wiki (see CONTRIBUTING.md).
#
# The action only accepts pull_request_target: under pull_request, a pull
# request could edit this workflow to add itself to the trusted authors or
# change the pattern. Safe here: no code from the pull request is checked out
# or run, the action only reads the list of changed files, with a read-only
# token, and this workflow comes from the target branch.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  check:
    name: Generated files untouched
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: xalvarez/prevent-file-change-action@dbc67c205c9ed02aa39c497b422c24f364c3e8dd # v3.0.1
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          pattern: '^(src/data/game|public/visuels)/'
          trustedAuthors: achedon12
