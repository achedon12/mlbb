name: Aligner develop

# main, c'est la production ; develop, le travail en cours. Tout ce qui arrive
# sur main — une version publiee, un correctif urgent, les donnees de la
# synchronisation quotidienne — est reporte aussitot sur develop, sans jamais
# de commit de fusion :
#
# - develop en retard sur main : avance rapide ;
# - develop porte des commits pas encore publies : ils sont rejoues par-dessus
#   main (rebase), puis develop est repoussee. L'historique reste lineaire et la
#   publication suivante sera une simple avance rapide de main.
#
# Le push passe par la cle de deploiement SYNC_DEPLOY_KEY, autorisee a
# contourner la protection de develop (force push apres un rebase).
on:
  push:
    branches: [main]
  workflow_call:
    secrets:
      SYNC_DEPLOY_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aligner-develop
  cancel-in-progress: false

jobs:
  aligner:
    name: Reporter main sur develop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Identifiants conserves : develop est repoussee a la fin.
        with: # zizmor: ignore[artipacked]
          fetch-depth: 0
          # Vide, checkout se rabat sur GITHUB_TOKEN.
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Avancer ou rejouer develop sur main
        run: |
          if ! git ls-remote --exit-code --heads origin develop > /dev/null; then
            echo "Pas encore de branche develop : rien a aligner."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main develop
          avant=$(git rev-parse origin/develop)
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop contient deja main."
            exit 0
          fi
          git checkout -q -B develop origin/develop
          if git merge-base --is-ancestor origin/develop origin/main; then
            git merge -q --ff-only origin/main
            git push -q origin HEAD:develop
            echo "develop avance jusqu'a $(git rev-parse --short HEAD)."
            exit 0
          fi
          # The nightly sync commits generated data on main, with main's scripts.
          # When develop changed the same files (a schema change, typically),
          # replaying develop conflicts every night and blocks publishing. That
          # data is regenerated at the next sync, so develop's version wins;
          # a conflict on anything else still needs a human.
          if ! git rebase -q origin/main; then
            while git rev-parse -q --verify REBASE_HEAD > /dev/null; do
              conflicts=$(git diff --name-only --diff-filter=U)
              others=$(printf '%s\n' "$conflicts" | grep -vE '^(src/data/|public/visuels/|scripts/[^/]+\.json$)' || true)
              if [ -z "$conflicts" ] || [ -n "$others" ]; then
                git rebase --abort
                echo "::error::Les commits de develop entrent en conflit avec main : rebasez develop sur main a la main."
                exit 1
              fi
              for f in $conflicts; do
                if git cat-file -e "REBASE_HEAD:$f" 2> /dev/null; then
                  git checkout REBASE_HEAD -- "$f"
                  git add -- "$f"
                else
                  git rm -q -- "$f"
                fi
              done
              echo "::warning::Generated data conflict, develop's version kept: $(printf '%s\n' "$conflicts" | tr '\n' ' ')"
              GIT_EDITOR=true git rebase --continue > /dev/null || true
            done
          fi
          # Le bail refuse d'ecraser un push arrive sur develop pendant le rebase.
          git push -q --force-with-lease="develop:$avant" origin HEAD:develop
          echo "develop rejouee sur main : $(git rev-list --count origin/main..HEAD) commit(s) a publier."
