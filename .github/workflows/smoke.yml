name: Live site check

# Every morning, after the data sync and its deploy: the key pages of
# mlbbdex.com and a sample of its sitemap must answer with a full page and no
# error screen. A failure fails the run, and GitHub emails the owner.
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    name: Key pages answer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check the live site
        run: node scripts/smoke.mjs https://mlbbdex.com
