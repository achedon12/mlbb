name: Welcome

# A contributor's first pull request: a welcome note when it opens, a thank
# you when it is merged.
#
# Using pull_request_target is safe here: no code from the pull request is
# checked out or run, a pinned action posts the comment.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed]
    branches: [develop]

permissions: {}

jobs:
  welcome:
    name: Welcome new contributors
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: plbstl/first-contribution@2c36bdb58684587f60549a69aaa3ec00b9d5f4fe # v4.3.3
        with:
          pr-reactions: rocket
          pr-opened-msg: >
            Welcome, and thank you for this first contribution to MLBBDex!


            A few pointers, detailed in the
            [contributing guide](https://github.com/achedon12/mlbb/blob/develop/CONTRIBUTING.md):

            - keep the pull request as a draft while you work on it, then mark
            it "Ready for review";

            - the tests must pass, and the repository owner reviews it before
            merging;

            - `src/data/game/` and `public/visuels/` are regenerated every night:
            don't edit them by hand.


            Any question? Ask it right here.
          pr-merged-msg: >
            @{fc-author} congratulations, your first contribution is merged! It
            will go live with the next release of mlbbdex.com.
