name: Bienvenue

# Premiere pull request d'un contributeur : un mot d'accueil a l'ouverture, un
# merci a la fusion.
#
# pull_request_target est sans risque ici : aucun code de la pull request n'est
# recupere ni execute, une action epinglee commente.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed]
    branches: [develop]

permissions: {}

jobs:
  accueillir:
    name: Accueillir les nouveaux contributeurs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: plbstl/first-contribution@2c36bdb58684587f60549a69aaa3ec00b9d5f4fe # v4.3.3
        with:
          pr-reactions: rocket
          pr-opened-msg: >
            Welcome, and thank you for this first contribution to MLBBDex!


            A few pointers, detailed in the
            [contributing guide](https://github.com/achedon12/mlbb/blob/develop/CONTRIBUTING.md):

            - keep the pull request as a draft while you work on it, then mark
            it "Ready for review";

            - the tests must pass, and the repository owner reviews it before
            merging;

            - `src/data/jeu/` and `public/visuels/` are regenerated every night:
            don't edit them by hand.


            Any question? Ask it right here.
          pr-merged-msg: >
            @{fc-author} congratulations, your first contribution is merged! It
            will go live with the next release of mlbbdex.com.
