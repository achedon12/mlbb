name: Image Docker

# Verifie que l'image de production se construit. On ne pousse rien : l'objectif
# est d'attraper une regression du Dockerfile avant le deploiement.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker-compose.yml
      - package.json
      - package-lock.json
      - next.config.ts
  pull_request:
    paths:
      - Dockerfile
      - docker-compose.yml
      - package.json
      - package-lock.json
      - next.config.ts

jobs:
  construire:
    name: Construire l'image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mlbb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
