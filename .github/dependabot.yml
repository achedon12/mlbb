version: 2

# Mises a jour automatiques des dependances, regroupees pour limiter le bruit :
# une pull request par lot plutot qu'une par paquet. Elles visent develop, comme
# toute pull request : elles partent en production avec la version suivante.
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    # Une version fraichement publiee attend une semaine : le temps qu'un
    # paquet compromis soit repere et retire avant d'arriver ici.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Les mises a jour mineures et correctives sont regroupees, sures a passer
    # en lot ; les versions majeures arrivent en pull requests separees, pour
    # etre relues et testees une par une plutot qu'appliquees en aveugle.
    groups:
      dependances:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    # Une version fraichement publiee attend une semaine : le temps qu'un
    # paquet compromis soit repere et retire avant d'arriver ici.
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
