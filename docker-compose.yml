services:

  mlbb:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlbb:latest
    container_name: mlbb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mlbb.leoderoin.fr}
    # Le site n'a aucun etat a conserver : l'identite vit dans le jeton de jeu,
    # les favoris dans le navigateur. Le conteneur peut tourner en lecture
    # seule, sans volume.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/sante"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
