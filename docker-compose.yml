services:

  mlbb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mlbbdex.com}
        NEXT_PUBLIC_MATOMO_URL: ${NEXT_PUBLIC_MATOMO_URL:-}
        NEXT_PUBLIC_MATOMO_SITE_ID: ${NEXT_PUBLIC_MATOMO_SITE_ID:-}
    image: mlbb:latest
    env_file:
      - .env
    container_name: mlbb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3003}:3001"
    read_only: true
    volumes:
      - ./logs:/app/logs
      # Abonnements aux notifications de patch et dernier patch annonce : un
      # volume nomme, conserve d'un `up -d --build` a l'autre (pas par `down -v`).
      - donnees:/app/donnees-serveur
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/sante"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  donnees:
