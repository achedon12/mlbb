services:

  mlbb:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlbb:latest
    container_name: mlbb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      # Obligatoire : le serveur refuse de demarrer sans.
      # Generer avec : openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?definir SESSION_SECRET dans .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mlbb.leoderoin.fr}
    volumes:
      # Seul etat persistant du site : les comptes et les favoris.
      - mlbb-data:/data
    # Le conteneur n'ecrit que dans /data et dans le cache de Next, tous deux
    # montes separement : le reste du systeme de fichiers peut rester en
    # lecture seule.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/sante"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mlbb-data:
