services:

  mlbb:
    build:
      context: .
      dockerfile: Dockerfile
    image: mlbb:latest
    container_name: mlbb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://mlbbdex.com}
      # Journaux applicatifs, ranges par jour dans le volume monte ci-dessous.
      LOGS_DIR: /app/logs
    # Le conteneur tourne en lecture seule ; seul le dossier des journaux est
    # inscriptible, via un volume monte sur l'hote (a creer, accessible en
    # ecriture a l'utilisateur 1001 du conteneur).
    read_only: true
    volumes:
      - ./logs:/app/logs
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/sante"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
